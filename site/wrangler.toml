# Deploys ftouny.com from the Astro build.
#
# The site lived at portfolio.ftouny.com until 2026-08-30, when it took
# over the apex from the wa-demos Worker's agency site. Custom Domains
# take precedence over routes, so attaching the apex here silently
# out-ranks wa-demos' `ftouny.com/*` route without touching the clinic
# demo subdomains, which stay on wa-demos via its `*.ftouny.com/*`
# wildcard. Reverting is deleting the apex Custom Domain from this
# Worker: the wa-demos route is still there underneath.
#
# (History: this Worker name dates from the old Angular deploy, which was
# deleted from the repo on 2026-08-30 and lives on in git history only.)
#
# Deploy:  npx astro build && npx wrangler deploy

name = "portfolio-ftouny"
main = "worker.js"
compatibility_date = "2026-08-24"

[assets]
directory = "./dist"
binding = "ASSETS"

# Astro pre-renders every route, so an unmatched path is genuinely missing.
# The Angular deploy used single-page-application fallback, which answered
# 200 to every wrong URL and told crawlers those pages existed. This serves
# dist/404.html with a real 404 status instead.
not_found_handling = "404-page"

# Every request goes through worker.js first, which 301s any non-apex
# hostname (portfolio.ftouny.com, and www if ever attached) to the apex
# before assets are considered.
run_worker_first = true

# Custom Domains rather than routes. Cloudflare manages the DNS records,
# and a Custom Domain takes precedence over any route on the same
# hostname. The old hostname stays attached purely to feed the redirect.
[[routes]]
pattern = "ftouny.com"
custom_domain = true

[[routes]]
pattern = "portfolio.ftouny.com"
custom_domain = true
